apiVersion: apps/v1
kind: Deployment
metadata:
  name: work-order
  namespace: geoinspect
  labels:
    app.kubernetes.io/name: work-order
    app.kubernetes.io/part-of: geoinspect
spec:
  replicas: 1
  selector:
    matchLabels:
      app: work-order
  template:
    metadata:
      labels:
        app: work-order
        app.kubernetes.io/name: work-order
        app.kubernetes.io/part-of: geoinspect
    spec:
      containers:
        - name: work-order
          image: geoinspect-work-order:a2
          imagePullPolicy: Never

          ports:
            - name: http
              containerPort: 8001

          env:
            - name: WORK_ORDER_PORT
              value: "8001"

            - name: WORK_ORDER_MONGODB_URL
              value: "mongodb://work_order_user:work_order_pass@mongodb:27017/work_order_db?authSource=work_order_db"

            - name: WORK_ORDER_MONGODB_DATABASE
              value: "work_order_db"

            - name: MAX_PHOTO_BYTES
              value: "10485760"

          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5

---
apiVersion: v1
kind: Service
metadata:
  name: work-order
  namespace: geoinspect
spec:
  selector:
    app: work-order
  ports:
    - name: http
      port: 8001
      targetPort: 8001
  type: ClusterIP
