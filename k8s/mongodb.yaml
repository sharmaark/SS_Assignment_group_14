apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
  namespace: geoinspect
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/part-of: geoinspect
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: root
  MONGO_INITDB_ROOT_PASSWORD: rootpass

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-init
  namespace: geoinspect
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/part-of: geoinspect
data:
  init.js: |
    db = db.getSiblingDB("work_order_db");

    db.createUser({
      user: "work_order_user",
      pwd: "work_order_pass",
      roles: [
        {
          role: "readWrite",
          db: "work_order_db"
        }
      ]
    });

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: geoinspect
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/part-of: geoinspect
spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: mongodb

  template:
    metadata:
      labels:
        app: mongodb
        app.kubernetes.io/name: mongodb
        app.kubernetes.io/part-of: geoinspect

    spec:
      containers:
        - name: mongodb
          image: mongo:7
          imagePullPolicy: IfNotPresent

          ports:
            - name: mongodb
              containerPort: 27017

          envFrom:
            - secretRef:
                name: mongodb-secret

          readinessProbe:
            exec:
              command:
                - mongosh
                - --username
                - root
                - --password
                - rootpass
                - --authenticationDatabase
                - admin
                - --quiet
                - --eval
                - db.adminCommand('ping')
            initialDelaySeconds: 8
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 10

          livenessProbe:
            exec:
              command:
                - mongosh
                - --username
                - root
                - --password
                - rootpass
                - --authenticationDatabase
                - admin
                - --quiet
                - --eval
                - db.adminCommand('ping')
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 4
            failureThreshold: 5

          volumeMounts:
            - name: mongodb-init
              mountPath: /docker-entrypoint-initdb.d

      volumes:
        - name: mongodb-init
          configMap:
            name: mongodb-init

---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: geoinspect
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/part-of: geoinspect
spec:
  selector:
    app: mongodb

  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017

  type: ClusterIP
